# 개발용 MySQL. 라이브(홈 서버)와 같은 8.0.45 를 쓴다.
#
# 왜 컨테이너인가 — 지금까지 로컬 검증은 SQLite 로 했는데, 라이브와 다르게
# 동작하는 지점이 이미 여럿 확인됐다. 대소문자 콜레이션(/SADANG/ 이 라이브에서만
# 200), 동시 쓰기 잠금, 격리 수준이 그렇다. 라이브 덤프를 그대로 올려서
# "배포하면 벌어질 일" 을 미리 본다.
#
# 이 컨테이너는 개발 전용이다. 여기 비밀번호는 공개돼도 무방한 값이고,
# 운영 자격증명과 아무 관계가 없다.
services:
  db:
    image: mysql:8.0.45
    container_name: bmapp-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: iidxrank
      MYSQL_USER: iidxrank
      MYSQL_PASSWORD: devpassword
    # 3306 은 호스트에서 다른 것이 쓸 수 있으므로 3307 로 내보낸다.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - bmapp_dev_mysql:/var/lib/mysql
    command:
      # 서버 기본값을 억지로 맞추지 않는다. 덤프의 CREATE 문이 들고 오는
      # charset/collation 을 그대로 살려야 라이브와 같은 조건이 된다.
      # 다만 대용량 덤프 임포트에서 걸리는 두 가지만 풀어 둔다.
      - --max_allowed_packet=256M
      - --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bmapp_dev_mysql:
