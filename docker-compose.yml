# 라이브 서버(홈 서버)에서 beatmania.app 을 띄우는 정의.
#
# MySQL 은 컨테이너에 넣지 않는다. 홈 서버에 이미 MySQL 8.0.46 이 돌고 있고
# 거기에 Nextcloud 등 다른 서비스의 데이터도 들어 있다. 그것을 컨테이너로
# 옮기는 것은 이 작업의 범위가 아니고, 잘못되면 잃는 것이 크다.
# 컨테이너는 호스트의 MySQL 에 붙는다.
#
# 쓰는 법
#   docker compose up -d --build      올리기
#   docker compose logs -f app        로그
#   docker compose down               내리기
#
# 마이그레이션은 자동으로 돌리지 않는다. 아래 '배포 절차' 참고.
#   docker compose run --rm app python manage.py migrate

services:
  app:
    build: .
    image: beatmania-app:latest
    restart: unless-stopped

    # .env 는 저장소에 없다. .env.example 을 복사해 채운다.
    # 컨테이너에서 호스트 MySQL 에 붙으므로 DB_HOST=host.docker.internal 이고,
    # Apache 뒤에 있으므로 DJANGO_BEHIND_PROXY=true 여야 한다.
    env_file:
      - .env

    # 바깥에 직접 노출하지 않는다. 127.0.0.1 에만 묶어 두고 Apache 가
    # 프록시한다. 0.0.0.0 으로 열면 방화벽 설정과 무관하게 8731 이
    # 인터넷에서 그대로 열리는 사고가 난다.
    ports:
      - "127.0.0.1:${APP_PORT:-8731}:8000"

    # 리눅스에서 host.docker.internal 은 기본 제공되지 않는다.
    # host-gateway 로 도커 브리지의 게이트웨이(보통 172.17.0.1)를 가리킨다.
    # 172.17.0.1 을 직접 적지 않는 이유는 그 주소가 환경마다 다르기 때문이다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 사용자가 올린 프로필 사진. 컨테이너를 다시 만들어도 남아야 하고,
    # Apache 가 /media/ 로 직접 내보내야 하므로 볼륨이 아니라 바인드 마운트다.
    # 호스트 쪽 디렉터리는 컨테이너의 uid 10001 이 쓸 수 있어야 한다.
    #   sudo mkdir -p /srv/beatmania/media && sudo chown -R 10001:10001 /srv/beatmania/media
    volumes:
      - ${MEDIA_DIR:-/srv/beatmania/media}:/app/media

    # 로그가 디스크를 채우지 않게 한다. 기본값은 무제한이라,
    # gunicorn 의 접근 로그가 오래 쌓이면 홈 서버의 디스크를 먹는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
